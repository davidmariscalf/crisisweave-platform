name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m py_compile crisisweave_platform.py prometheus_server.py server_runtime.py audit_guard.py
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: |
          export CW_TOKEN_PEPPER='ci-pepper-value-that-is-long-enough-123'
          tmp="$(mktemp -d)"
          python crisisweave_platform.py --db "$tmp/platform.db" --private-db "$tmp/private.db" init
          python audit_guard.py install --db "$tmp/platform.db" --private-db "$tmp/private.db" >/dev/null
          python audit_guard.py verify --db "$tmp/platform.db" >/dev/null
          python crisisweave_platform.py --db "$tmp/platform.db" --private-db "$tmp/private.db" create-org demo "Demo Org"
          python crisisweave_platform.py --db "$tmp/platform.db" --private-db "$tmp/private.db" create-principal admin --org demo --name "Admin" --role admin
          python crisisweave_platform.py --db "$tmp/platform.db" --private-db "$tmp/private.db" issue-token admin | python -c "import json,sys; d=json.load(sys.stdin); assert d['token'].startswith('cw_')"
      - name: Build and smoke test container
        run: |
          docker build -t crisisweave-platform:test .
          docker run -d --name cw-platform-test -e CW_TOKEN_PEPPER='container-ci-pepper-value-long-enough-123' -p 127.0.0.1:18080:8080 crisisweave-platform:test
          trap 'docker rm -f cw-platform-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz | python -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True'
          curl --fail --silent http://127.0.0.1:18080/metrics | grep -q 'crisisweave_platform_uptime_seconds'
          curl --fail --silent http://127.0.0.1:18080/metrics | grep -q 'crisisweave_platform_http_worker_limit 64'
          docker exec cw-platform-test python audit_guard.py verify >/dev/null
