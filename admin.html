<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrisisWeave Platform</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#09111f;color:#e8eef8}.shell{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{margin:0;font-size:22px}.muted{color:#91a2bb}.login,.card{background:#101b2d;border:1px solid #293a55;border-radius:14px;padding:15px;margin-top:16px}.login{display:grid;grid-template-columns:1fr auto;gap:8px}input,button{font:inherit;border-radius:9px;border:1px solid #354864;padding:10px;background:#142238;color:#edf3fb}button{cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#94a8c4;margin:0 0 10px}.big{font-size:24px;font-weight:800}.row{padding:10px 0;border-top:1px solid #263750}.ok{color:#72dda1}.bad{color:#ff9b86}@media(max-width:760px){.grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}}</style></head><body><div class="shell"><div class="top"><div><h1>CrisisWeave platform</h1><div class="muted">Organisation control plane</div></div><span id="status" class="muted">Not authenticated</span></div><div class="login"><input id="token" type="password" autocomplete="off" placeholder="Bearer token (kept only in page memory)"><button id="connect">Connect</button></div><div class="grid"><div class="card"><h2>Identity</h2><div id="identity" class="muted">—</div></div><div class="card"><h2>Worksites</h2><div id="worksites" class="big">—</div></div><div class="card"><h2>Health</h2><div id="health">Loading…</div></div></div><div class="card"><h2>Recent audit</h2><div id="audit" class="muted">Connect with a coordinator/admin token.</div></div></div><script>let auth='';const $=x=>document.getElementById(x);async function api(p){const r=await fetch(p,{headers:auth?{Authorization:'Bearer '+auth}:{}});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}async function health(){try{let d=await api('/healthz');$('health').innerHTML=d.ok?'<span class="ok">Healthy</span>':'<span class="bad">Degraded</span>'}catch(e){$('health').textContent=e.message}}async function load(){auth=$('token').value.trim();$('token').value='';try{let me=await api('/api/v1/me');$('identity').textContent=`${me.display_name} · ${me.role} · ${me.organisation_id}`;$('status').innerHTML='<span class="ok">Authenticated</span>';let ws=await api('/api/v1/worksites');$('worksites').textContent=(ws.worksites||[]).length;try{let a=await api('/api/v1/audit?limit=20');$('audit').innerHTML=(a.audit||[]).map(x=>`<div class="row"><strong>${x.action}</strong> · ${x.outcome}<br><span class="muted">${x.at} · ${x.principal_id||'system'} · ${x.target||''}</span></div>`).join('')||'No audit events.'}catch(e){$('audit').textContent=e.message}}catch(e){auth='';$('status').innerHTML='<span class="bad">Authentication failed</span>';$('identity').textContent=e.message;$('worksites').textContent='—'}}$('connect').onclick=load;health();</script></body></html>
